[build]
  command = "npm run build"
  publish = "dist"

# 예약확인서 카드 생성기가 서버리스 함수(.netlify/functions/reservation-confirm)에서
# 정적 페이지(/reservation-confirm/)로 옮겨감에 따라 기존 북마크가 안 깨지도록 리다이렉트.
[[redirects]]
  from = "/.netlify/functions/reservation-confirm"
  to = "/reservation-confirm/"
  status = 301

# 성형수가표 페이지가 쿼리 파라미터(?page=surgery)에서 고유 경로(/surgery-price)로
# 옮겨감에 따라, 검색엔진·외부 링크가 구 URL로 들어와도 서버 단에서 301로 보낸다.
#
# 처음엔 여기(위처럼 query 조건 + force=true인 [[redirects]])로 시도했으나 실제로는
# 안 먹혔다 — /zh, /en이 정적 파일(zh.html, en.html)로 직접 서빙되는데, Netlify가
# 그 정적 파일 매치를 쿼리스트링과 무관하게(force=true여도) 우선시해서 리다이렉트
# 규칙 자체가 평가되지 않았다(배포 후 /zh?page=surgery와 /zh?아무값 전부 zh.html과
# 동일한 ETag로 응답하는 걸로 확인). 정적 파일 서빙보다 먼저 실행되는 Edge Function
# (netlify/edge-functions/surgery-redirect.ts)으로 옮겨서 확실하게 처리한다.
[[edge_functions]]
  path = "/zh"
  function = "surgery-redirect"

[[edge_functions]]
  path = "/en"
  function = "surgery-redirect"

[[headers]]
  for = "/studio.mp4"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/studio_eng.mp4"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/concierge_jinxianyou.mp4"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/concierge_lijing.mp4"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/category-hero/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
