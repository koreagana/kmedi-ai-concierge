[build]
  command = "npm run build"
  publish = "dist"

# 예약확인서 카드 생성기가 서버리스 함수(.netlify/functions/reservation-confirm)에서
# 정적 페이지(/reservation-confirm/)로 옮겨감에 따라 기존 북마크가 안 깨지도록 리다이렉트.
[[redirects]]
  from = "/.netlify/functions/reservation-confirm"
  to = "/reservation-confirm/"
  status = 301

# 성형수가표 페이지가 쿼리 파라미터(?page=surgery)에서 고유 경로(/surgery-price)로
# 옮겨감에 따라, 검색엔진·외부 링크가 구 URL로 들어와도 서버 단에서 301로 보낸다
# (클라이언트 사이드 이동만으로는 크롤러가 새 URL을 못 찾음).
# force=true 필수: /zh, /en에 대응하는 정적 파일(zh.html, en.html)이 실제로 있어서,
# force 없이는 쿼리스트링 무시하고 그 정적 파일이 먼저 서빙돼 리다이렉트가 무시된다.
[[redirects]]
  from = "/zh"
  to = "/zh/surgery-price"
  status = 301
  force = true
  query = { page = "surgery" }

[[redirects]]
  from = "/en"
  to = "/en/surgery-price"
  status = 301
  force = true
  query = { page = "surgery" }

[[headers]]
  for = "/studio.mp4"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/studio_eng.mp4"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/concierge_jinxianyou.mp4"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/concierge_lijing.mp4"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/category-hero/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
